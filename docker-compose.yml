version: '3.8'
services:
  python-web:
    build:
      context: .
      dockerfile: Dockerfile.python
    ports:
      - "5000:5000"
    container_name: smartlamp-python

  java-api:
    build:
      context: .
      dockerfile: Dockerfile.java
    ports:
      - "8080:8080"
    container_name: smartlamp-java
